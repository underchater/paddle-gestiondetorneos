<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneos de Paddle</title>
<style>
:root{--bg:#f3f6f4;--c:#fff;--t:#16241c;--p:#1b7f4b;--b:#d6dfd9}
@media(prefers-color-scheme:dark){:root{--bg:#121a15;--c:#1b2620;--t:#e8f0ea;--p:#3fbf79;--b:#2c3b32}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:var(--p);color:#fff}
header h1{margin:0;font-size:1.2rem}header button{background:#fff;color:var(--p)}
nav{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem 1rem}
nav button.on{background:var(--p);color:#fff}nav button{background:var(--c);color:var(--t);border:1px solid var(--b)}
main,#auth{max-width:900px;margin:0 auto;padding:1rem}
#auth{max-width:420px}
form{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
input,select,button{padding:.55rem .7rem;border-radius:8px;border:1px solid var(--b);font:inherit;background:var(--c);color:var(--t);flex:1 1 150px}
button{background:var(--p);color:#fff;border:0;cursor:pointer;flex:0 0 auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:.8rem;margin:.5rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem}
table{width:100%;border-collapse:collapse;background:var(--c)}th,td{padding:.5rem;border-bottom:1px solid var(--b);text-align:left}
#msg{margin:.5rem 1rem;padding:0 .2rem;font-weight:600}.ok{color:var(--p)}.bad{color:#d33}
.wrap{overflow-x:auto}
</style></head>
<body><div id="app"></div>
<script>
let T = localStorage.getItem('t'), R = localStorage.getItem('r'), N = localStorage.getItem('n'), cur = 'torneos';
const $ = s => document.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const msg = (t, ok) => { const m = $('#msg'); if (m) { m.textContent = t; m.className = ok ? 'ok' : 'bad'; } };

async function api(u, m = 'GET', b) {
  const r = await fetch('/api/' + u, { method: m, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + T }, body: b && JSON.stringify(b) });
  const d = await r.json();
  if (r.status === 401 && T) salir();
  if (!r.ok) throw new Error(d.error);
  return d;
}
function salir() { localStorage.clear(); T = R = N = null; render(); }   // R10: cerrar sesión

async function login(ev) {
  ev.preventDefault();
  try {
    const r = await api('login', 'POST', Object.fromEntries(new FormData(ev.target)));
    T = r.token; R = r.rol; N = r.nombre;
    localStorage.setItem('t', T); localStorage.setItem('r', R); localStorage.setItem('n', N);
    render();
  } catch (x) { msg(x.message); }
  return false;
}
async function reg(ev) {
  ev.preventDefault();
  try {
    const r = await api('registro', 'POST', Object.fromEntries(new FormData(ev.target)));
    ev.target.reset(); msg(r.ok + '. Ahora inicia sesión.', 1);
  } catch (x) { msg(x.message); }
  return false;
}
// envío genérico de formularios del panel
async function f(ev, ruta, m = 'POST') {
  ev.preventDefault();
  try {
    const r = await api(ruta, m, Object.fromEntries(new FormData(ev.target)));
    cur === 'partidos' || cur === 'tabla' ? await cargar() : await tab(cur);
    msg(r.ok, 1);
  } catch (x) { msg(x.message); }
  return false;
}

const authHtml = `<div id="auth"><h1>🎾 Torneos de Paddle</h1><div id="msg"></div>
<div class="card"><h2>Iniciar sesión</h2><form onsubmit="return login(event)">
<input name="usuario" placeholder="Usuario" required><input name="clave" type="password" placeholder="Contraseña" required><button>Entrar</button></form></div>
<div class="card"><h2>Registrarse</h2><form onsubmit="return reg(event)">
<input name="nombre" placeholder="Nombre completo" required><input name="usuario" placeholder="Usuario" required>
<input name="clave" type="password" placeholder="Contraseña (mín. 6)" required>
<select name="categoria"><option>Principiante<option>Intermedio<option>Avanzado</select>
<input name="codigo" placeholder="Código de administrador (opcional)"><button>Registrarme</button></form></div></div>`;

const TABS = { torneos: 'Torneos', equipos: 'Equipos', partidos: 'Partidos', tabla: 'Clasificación', jugadores: 'Jugadores' };
function render() {
  $('#app').innerHTML = T
    ? `<header><h1>🎾 Torneos de Paddle</h1><span>${e(N)} · ${e(R)}</span><button onclick="salir()">Cerrar sesión</button></header>
       <nav>${Object.entries(TABS).map(([k, v]) => `<button data-t="${k}" onclick="tab('${k}')">${v}</button>`).join('')}</nav>
       <div id="msg"></div><main id="main"></main>`
    : authHtml;
  if (T) tab('torneos');
}
async function tab(n) {
  cur = n;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  $('#msg').textContent = '';
  try { $('#main').innerHTML = await V[n](); if ($('#tor')) cargar(); } catch (x) { msg(x.message); }
}

const selTorneo = async titulo => {
  const t = await api('torneos');
  if (!t.length) return `<h2>${titulo}</h2><p>No hay torneos creados.</p>`;
  return `<h2>${titulo}</h2><select id="tor" onchange="cargar()">${t.map(x => `<option value="${x.id}">${e(x.nombre)}</option>`).join('')}</select><div id="sub"></div>`;
};
async function cargar() {
  const id = $('#tor').value; let h;
  try { h = cur === 'tabla' ? await tabla(id) : await partidos(id); } catch (x) { h = `<p>${e(x.message)}</p>`; }
  $('#sub').innerHTML = h;
}
async function partidos(id) {
  const eq = await api('equipos'); let l = [], vacio = '';
  try { l = await api('partidos/' + id); } catch (x) { vacio = `<p>${e(x.message)}</p>`; }
  const o = eq.map(x => `<option value="${x.id}">${e(x.nombre)}</option>`).join('');
  const form = R === 'admin' ? `<form onsubmit="return f(event,'partidos')"><input type="hidden" name="torneo_id" value="${id}">
    <input name="fecha" type="date" required><select name="equipo1">${o}</select><select name="equipo2">${o}</select><button>Programar partido</button></form>` : '';
  return form + vacio + l.map(p => `<div class="card"><b>${e(p.e1)}</b> vs <b>${e(p.e2)}</b> · ${e(p.fecha)}<br>` +
    (p.ganador ? `Resultado: ${e(p.resultado)} · Ganador: ${e(p.ganador === p.equipo1 ? p.e1 : p.e2)}`
      : R === 'admin' ? `<form onsubmit="return f(event,'partidos/${p.id}/resultado','PUT')"><input name="resultado" placeholder="Ej: 6-4 6-3" required>
        <select name="ganador"><option value="${p.equipo1}">${e(p.e1)}<option value="${p.equipo2}">${e(p.e2)}</select><button>Guardar resultado</button></form>`
      : 'Pendiente') + '</div>').join('');
}
async function tabla(id) {
  const l = await api('clasificacion/' + id);
  if (!l.length) return '<p>Aún no hay partidos para clasificar.</p>';
  return `<div class="wrap"><table><tr><th>#<th>Equipo<th>PJ<th>PG<th>PP<th>Pts</tr>${l.map((x, i) =>
    `<tr><td>${i + 1}<td>${e(x.equipo)}<td>${x.pj}<td>${x.pg}<td>${x.pp}<td><b>${x.pts}</b></tr>`).join('')}</table></div>`;
}

const V = {
  async torneos() {
    const l = await api('torneos');
    return `<h2>Torneos</h2>` + (R === 'admin' ? `<form onsubmit="return f(event,'torneos')"><input name="nombre" placeholder="Nombre del torneo" required>
      <input name="fecha_inicio" type="date" required><input name="reglas" placeholder="Reglas (opcional)"><button>Crear torneo</button></form>` : '') +
      `<div class="grid">${l.map(t => `<div class="card"><b>${e(t.nombre)}</b><br>Inicio: ${e(t.fecha_inicio)}<br><small>${e(t.reglas)}</small></div>`).join('') || '<p>No hay torneos.</p>'}</div>`;
  },
  async equipos() {
    const [l, j] = await Promise.all([api('equipos'), api('jugadores')]);
    const o = j.map(x => `<option value="${x.id}">${e(x.nombre)} (${e(x.categoria)})</option>`).join('');
    return `<h2>Equipos</h2>` + (R === 'admin' ? `<form onsubmit="return f(event,'equipos')"><input name="nombre" placeholder="Nombre del equipo" required>
      <select name="jugador1">${o}</select><select name="jugador2">${o}</select><button>Crear equipo</button></form>` : '') +
      `<div class="wrap"><table><tr><th>Equipo<th>Jugadores</tr>${l.map(x => `<tr><td>${e(x.nombre)}<td>${e(x.n1)} y ${e(x.n2)}</tr>`).join('')}</table></div>`;
  },
  partidos: () => selTorneo('Partidos'),
  tabla: () => selTorneo('Clasificación'),
  async jugadores() {
    const l = await api('jugadores');
    return `<h2>Jugadores</h2><div class="wrap"><table><tr><th>Nombre<th>Categoría</tr>${l.map(x => `<tr><td>${e(x.nombre)}<td>${e(x.categoria)}</tr>`).join('')}</table></div>`;
  }
};
render();
</script></body></html>
