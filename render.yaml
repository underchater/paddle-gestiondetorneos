databases:
  - name: paddle-postgres
    plan: free
    databaseName: paddle
    user: paddle

services:
  - type: web
    name: paddle-gestiondetorneos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: DATABASE_URL
        fromDatabase:
          name: paddle-postgres
          property: connectionString
